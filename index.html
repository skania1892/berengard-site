<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berengard Technologies</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
	<!-- No third-party scripts here by design. /privacy.html states this site
	     sets no cookies and loads no trackers; adding any script that does
	     means updating that page first. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
	<!-- Hidden form so Netlify detects it at build time -->
	<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
	  <input type="hidden" name="form-name" value="contact" />
	  <p style="display:none;">
		<label>Don’t fill this out: <input name="bot-field" /></label>
	  </p>
	  <input name="name" />
	  <input name="email" />
	  <input name="company" />
	  <textarea name="message"></textarea>
	</form>
  </body>
</html>

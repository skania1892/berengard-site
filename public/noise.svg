<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Self-hosted film-grain texture. Previously loaded from
       grainy-gradients.vercel.app; served locally so the site makes no
       third-party requests, as /privacy.html states.

       KEEP width AND height. With viewBox alone the SVG has an aspect ratio
       but no intrinsic size, so `background-size: auto` stretches ONE copy
       across the whole element — the turbulence scales up into big soft
       blobs instead of fine grain. Explicit 200x200 gives it an intrinsic
       size so the background tiles correctly. -->
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)" />
</svg>
